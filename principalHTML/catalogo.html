<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Completo</title>

    <!-- concecta con boostrap para las clases card, row -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../diseno.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<!-- cards del boostrap -->
<body>
    <a href="../index.html" style="display: flex; align-items: center; text-decoration: none; color: white; gap: 10px;">
        <img src="https://uxwing.com/wp-content/themes/uxwing/download/web-app-development/home-page-white-icon.png" alt="Volver al inicio" style="width: 40px; border: none;">
        <span style="font-weight: bold; font-size: 18px;">Inicio</span>
    </a>
    <div class="container mt-4 mb-5" x-data="catalogoApp()">

        
        <h1 class="mb-4" style="color: white">Catálogo</h1>
        <input type="text" x-model="busqueda" placeholder="Buscar por título..." class="form-control mb-3" style="max-width: 400px;">

        <button type="button" class="btn btn-outline-light mb-3" @click="mostrarAyuda = !mostrarAyuda" x-text="mostrarAyuda ? 'Ocultar ayuda' : 'Mostrar ayuda'"></button>

        <div x-show="mostrarAyuda" class="mb-3" style="color: white; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px;">
            <p>Usa el buscador para filtrar películas por título. Haz clic en cualquier póster para ver el detalle de la película y dejar un comentario.</p>
        </div>

        <p x-show="cargando" style="color: white">Cargando películas...</p>
        <p x-show="error" style="color: salmon">Ocurrió un error al cargar el catálogo.</p>
        <p x-show="!cargando && !error && filtradas.length === 0" style="color: white">No se encontraron películas con ese nombre.</p>
        
        
    

<div class="row row-cols-1 row-cols-md-3 g-4">
    <template x-for="pelicula in filtradas" :key="pelicula.id">
        <div class="col">
            <div class="card bg-dark">
                <img class="card-img-top" :src="pelicula.poster" :alt="pelicula.titulo" style="aspect-ratio: 2/3; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title mb-0">
                        <a :href="pelicula.pagina" class="text-decoration-none stretched-link" style="color: white;" x-text="pelicula.titulo"></a>
                    </h5>
                </div>
            </div>
        </div>
    </template>
</div>   
            

        
    </div>
</body>
<script>
function catalogoApp() {
  return {
    peliculas: [],
    busqueda: '',
    cargando: true,
    error: false,
    mostrarAyuda: false,
    get filtradas() {
      return this.peliculas.filter(p =>
        p.titulo.toLowerCase().includes(this.busqueda.toLowerCase())
      );
    },

    init() {
      fetch('../datos/peliculas.json')
        .then(r => {
          if (!r.ok) throw new Error('No se pudo cargar el archivo');
          return r.json();
        })
        .then(datos => {
          this.peliculas = datos;
          this.cargando = false;
        })
        .catch(() => {
          this.error = true;
          this.cargando = false;
        });
    }
  }
}
</script>
</html>
