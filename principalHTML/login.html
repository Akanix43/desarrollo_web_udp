<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="../diseno.css">
</head>

<body>
    <a href="../index.html" style="display: flex; align-items: center; text-decoration: none; color: black; gap: 10px;">
        <img src="https://images.icon-icons.com/907/PNG/512/house-black-building-shape_icon-icons.com_70469.png" alt="Volver al inicio" style="width: 40px; border: none;">
        <span style="font-weight: bold; font-size: 18px;">Inicio</span>
    </a>
    <div class="login-container">
        <h1>Iniciar Sesión</h1>

        <form id="formulario">
            <label>Correo electrónico:</label>
            <input type="email" id="correo" required>
            <br><br>
            <label>Contraseña:</label>
            <input type="password" id="clave" required>
            <br><br>
            <button type="submit">Acceder</button>
        </form>

        <p id="mensaje" style="font-weight: bold; margin-top: 20px"></p>
        
        <script src="jscript/loginJS.js"></script>
    </div>
</body>
</html>
